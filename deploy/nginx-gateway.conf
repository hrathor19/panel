# Install to /etc/nginx/sites-available/npf-gateway, then:
#   ln -s /etc/nginx/sites-available/npf-gateway /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d panel.kollegeapply.com
#
# certbot rewrites this file to add the TLS block and the port-80 redirect.
# Leave it as plain HTTP until certbot has run, or the first issuance fails.

server {
    listen 80;
    listen [::]:80;
    server_name panel.kollegeapply.com;

    # Lead exports can be large; panel reports can be slow.
    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Downloads stream through the gateway — buffering them to disk first adds
    # latency and fills /var/cache on a small VM.
    proxy_buffering off;

    access_log /var/log/nginx/npf-gateway.access.log;
    error_log  /var/log/nginx/npf-gateway.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
