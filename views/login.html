<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Panel Gateway</title>
<script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('gw-theme') === 'dark' ? 'dark' : 'light'); } catch (e) {}</script>
<link rel="stylesheet" href="/gw-assets/app.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 22px; }
  .wrap { width: min(416px, 100%); }
  .mark { display: flex; align-items: center; justify-content: center; gap: 11px; font-size: 19px; font-weight: 680; letter-spacing: -.025em; margin-bottom: 8px; }
  .lede { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .foot { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 20px; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 15px; }
  .status[hidden] { display: none; }
  .spin { width: 14px; height: 14px; border: 2px solid var(--border-firm); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .why { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; color: var(--text-2); margin-bottom: 16px; }
  .why strong { display: block; margin-bottom: 3px; font-size: 13px; color: var(--text); }
  .corner { position: fixed; top: 18px; right: 18px; }
</style>
</head>
<body>
<span class="corner" id="themeSlot"></span>

<div class="wrap">
  <div class="mark"><span class="brand-mark" id="brandMark"></span> Panel Gateway</div>
  <p class="lede">Sign in with the account you were given.</p>

  <form class="card" id="form" novalidate>
    <div style="padding:22px">
      <div class="inline-error" id="error"></div>
      <div class="why" id="why" hidden>
        <strong>Location is required</strong>
        Signing in records where you are, so access to lead data can be traced. Your browser will ask for permission.
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="username" required autofocus spellcheck="false">
      </div>
      <div class="field" style="margin-bottom:20px">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>

      <div class="status" id="status" hidden><span class="spin"></span><span id="statusText"></span></div>
      <button class="primary" type="submit" id="submit" style="width:100%;padding:11px">Sign in</button>
    </div>
  </form>

  <p class="foot">Lost your password? Ask an administrator to reset it.</p>
</div>

<script type="module">
import { $, api, icon, themeToggle } from '/gw-assets/ui.js';

$('brandMark').append(icon('layers', 19));
$('themeSlot').append(themeToggle());

const submit = $('submit');
const errorBox = $('error');
const statusRow = $('status');
const statusText = $('statusText');

let locationRequired = false;
try {
  ({ location: locationRequired } = await (await fetch('/gw/auth/requirements')).json());
} catch { /* if we cannot ask, let the server be the judge */ }
$('why').hidden = !locationRequired;

function setStatus(text) {
  statusText.textContent = text;
  statusRow.hidden = !text;
}

// Geolocation is a secure-context API: over plain HTTP on anything but
// localhost the browser refuses it, and no amount of clicking Allow helps.
// Saying so beats letting someone fight a prompt that will never appear.
function locationUnavailableReason() {
  if (!window.isSecureContext) {
    return 'This page is not served over HTTPS, so your browser will not share your location. '
      + 'Open the gateway over https:// (or on the machine itself) to sign in.';
  }
  if (!navigator.geolocation) return 'This browser cannot report a location.';
  return null;
}

function getLocation() {
  return new Promise((resolve) => {
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ status: 'granted', latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracy: pos.coords.accuracy, timestamp: pos.timestamp }),
      (err) => resolve({ status: err.code === err.PERMISSION_DENIED ? 'denied' : err.code === err.TIMEOUT ? 'timeout' : 'unavailable', message: err.message }),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  });
}

function clientDetails() {
  let timezone = null;
  try { timezone = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { /* older browser */ }
  return { screen: `${screen.width}x${screen.height}`, timezone };
}

$('form').addEventListener('submit', async (event) => {
  event.preventDefault();
  errorBox.textContent = '';

  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password) { errorBox.textContent = 'Enter your email and password.'; return; }

  submit.disabled = true;
  submit.textContent = 'Signing in…';

  try {
    let position = { status: 'skipped' };

    if (locationRequired) {
      const blocked = locationUnavailableReason();
      if (blocked) { errorBox.textContent = blocked; return; }
      setStatus('Checking your location…');
      position = await getLocation();
      setStatus('');

      if (position.status !== 'granted') {
        errorBox.textContent = position.status === 'denied'
          ? 'Location access was denied. This panel can only be opened with location sharing turned on — allow it for this site in your browser, then try again.'
          : position.status === 'timeout'
            ? 'Timed out waiting for your location. Check that location services are on, then try again.'
            : 'Your location could not be read. Check that location services are on, then try again.';
        return;
      }
    }

    await api('/gw/auth/login', { method: 'POST', body: { email, password, location: position, client: clientDetails() } });

    const next = new URLSearchParams(window.location.search).get('next');
    window.location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/panels';
  } catch (err) {
    errorBox.textContent = err.message;
    $('password').value = '';
    $('password').focus();
  } finally {
    setStatus('');
    submit.disabled = false;
    submit.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
