<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panels · Panel Gateway</title>
<link rel="stylesheet" href="/gw-assets/app.css">
<style>
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 18px 72px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(252px, 1fr)); }
  .tile {
    display: flex; flex-direction: column; gap: 4px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
    box-shadow: var(--sh-1); padding: 19px; color: inherit;
    transition: transform .1s ease, box-shadow .1s ease, border-color .1s ease;
  }
  .tile:hover { text-decoration: none; transform: translateY(-2px); box-shadow: var(--sh-2); border-color: var(--border-firm); }
  .tile .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .tile .name { font-size: 16.5px; font-weight: 620; letter-spacing: -.01em; }
  .tile .host { color: var(--muted); font-size: 12.5px; word-break: break-all; }
  .tile .open { margin-top: 13px; display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 13.5px; font-weight: 550; }
</style>
</head>
<body>
<header class="topbar">
  <span style="display:flex;align-items:center;gap:9px;font-weight:640;letter-spacing:-.02em">
    <span style="width:9px;height:9px;border-radius:3px;background:var(--accent)"></span> Panel Gateway
  </span>
  <span class="spacer"></span>
  <span id="menuSlot"></span>
</header>

<div class="wrap">
  <div class="page-head">
    <div>
      <h1>Your panels</h1>
      <p class="sub">Each opens with its shared account already signed in. You never need its password.</p>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="empty"></div>
</div>

<script type="module">
import { $, el, icon, tag, toast, emptyState, accountMenu, whoami } from '/gw-assets/ui.js';

(async () => {
  const { user, panels } = await whoami();
  $('menuSlot').append(accountMenu(user));

  if (panels.length === 0) {
    $('empty').append(emptyState('inbox', 'No panels yet',
      user.role === 'admin'
        ? 'Add one in Administration → Panels.'
        : 'No panels have been assigned to you. Ask an administrator.'));
    return;
  }

  const grid = $('grid');
  for (const panel of panels) {
    grid.append(el('a', { class: 'tile', href: `/p/${panel.slug}/` },
      el('div', { class: 'top' },
        el('div', {},
          el('div', { class: 'name', text: panel.label }),
          el('div', { class: 'host', text: new URL(panel.origin).host }),
        ),
        panel.upstream?.connected ? tag('Live', 'ok', true) : null,
      ),
      el('div', { class: 'open' }, 'Open panel', icon('external', 14)),
    ));
  }
})();
</script>
</body>
</html>
