<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panels · Panel Gateway</title>
<script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('gw-theme') === 'dark' ? 'dark' : 'light'); } catch (e) {}</script>
<link rel="stylesheet" href="/gw-assets/app.css">
<style>
  .wrap { max-width: 1120px; margin: 0 auto; padding: 34px 24px 72px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); }
  .tile {
    display: flex; flex-direction: column; gap: 3px; color: inherit;
    background: var(--surface); border: 1px solid var(--border); border-radius: 15px;
    box-shadow: var(--shadow-sm); padding: 20px;
    transition: transform .1s ease, box-shadow .1s ease, border-color .1s ease;
  }
  .tile:hover { text-decoration: none; transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--accent); }
  .tile .top { display: flex; align-items: flex-start; gap: 12px; }
  .tile .name { font-size: 17px; font-weight: 650; letter-spacing: -.015em; }
  .tile .host { color: var(--muted); font-size: 12.5px; word-break: break-all; }
  .tile .open { margin-top: 15px; display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 13.5px; font-weight: 580; }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand" style="padding:0"><span class="brand-mark" id="brandMark"></span><span>Panel Gateway</span></span>
  <span class="grow"></span>
  <span id="themeSlot"></span>
  <span id="accountSlot"></span>
</header>

<div class="wrap">
  <div class="page-head">
    <div>
      <h1>Your panels</h1>
      <p>Each opens with its shared account already signed in. You never need its password.</p>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="empty"></div>
</div>

<script type="module">
import { $, el, icon, badge, emptyState, accountMenu, whoami, themeToggle } from '/gw-assets/ui.js';

$('brandMark').append(icon('layers', 19));
$('themeSlot').append(themeToggle());

const { user, panels } = await whoami();
$('accountSlot').append(accountMenu(user));

if (panels.length === 0) {
  $('empty').append(emptyState('inbox', 'No panels yet',
    user.role === 'admin' ? 'Add one in Administration → Panels.' : 'No panels have been assigned to you. Ask an administrator.'));
} else {
  for (const panel of panels) {
    $('grid').append(el('a', { class: 'tile', href: `/p/${panel.slug}/` },
      el('div', { class: 'top' },
        el('div', { class: 'stat-icon tone-blue', style: 'width:40px;height:40px' }, icon('globe', 19)),
        el('div', { style: 'min-width:0' },
          el('div', { class: 'name', text: panel.label }),
          el('div', { class: 'host', text: new URL(panel.origin).host })),
        panel.upstream?.connected ? badge('Live', 'ok', true) : null),
      el('div', { class: 'open' }, 'Open panel', icon('external', 14))));
  }
}
</script>
</body>
</html>
